name: Code Quality

on:
  push:
    branches:
      - "chatgpt/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Check RPC contract
        run: npm run check:rpc-contract

      - name: Check SQL migration safety
        run: npm run check:sql-migrations

      - name: Check Edge API contracts
        run: npm run check:edge-contract

      - name: Build web app
        run: npm run build:web
